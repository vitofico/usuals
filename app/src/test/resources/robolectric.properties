# Pin the emulated API level for every Robolectric test in :app.
#
# Left unset, Robolectric follows targetSdk and each test class can end up on a
# different android-all jar, which it fetches over the network the first time it
# needs one. Inside the build container that turns a fast test into a stall with
# no output, and the per-task timeout in the root build script is what notices.
# Pinning it here keeps the whole module on one jar and makes the suite
# reproducible; a test that genuinely needs another level overrides it with its
# own @Config.
sdk=33
