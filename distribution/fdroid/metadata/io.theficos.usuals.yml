MaintainerNotes: |-
  Android builds independently from the optional server and web client.
  Release assembly is unsigned. Upstream signs with build-tools 34.0.0 and checks
  clean APK reproduction with apksigcopier; preserve the developer signature.
  No Google Play Services or proprietary SDKs are included. Model and catalog
  requests are opt-in and sent directly by the device. Voice uses the selected
  Android speech service and can be unavailable; keyboard entry works offline.
  The recipe names the immutable tag; pin its full source SHA in fdroiddata.

