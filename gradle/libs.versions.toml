[versions]
agp = "8.5.2"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
compose-bom = "2024.09.02"
nav-compose = "2.8.1"
lifecycle = "2.8.6"
activity-compose = "1.9.2"
coroutines = "1.9.0"
serialization = "1.7.2"
okhttp = "4.12.0"
room = "2.6.1"
work = "2.9.1"
security-crypto = "1.1.0-alpha06"
junit = "4.13.2"
robolectric = "4.13"
# The android-all jars Robolectric runs against, staged by the root build so it
# never fetches them itself. One per API level the suite actually asks for:
# 26 is the minSdk boundary in SpeechAvailabilityTest, 33 is the level pinned
# in robolectric.properties, and 34 is targetSdk, which Robolectric loads the
# app package with regardless of the level a test emulates. Adding a level to
# a @Config means adding its jar here too. The -i6 suffix is Robolectric 4.13's
# instrumentation revision and moves with `robolectric`.
robolectric-android-all-api26 = "8.0.0_r4-robolectric-r1-i6"
robolectric-android-all-api33 = "13-robolectric-9030017-i6"
robolectric-android-all-api34 = "14-robolectric-10818077-i6"
turbine = "1.1.0"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"
androidx-test-rules = "1.6.1"
androidx-test-junit = "1.2.1"
truth = "1.4.4"
espresso = "3.7.0"
zxing-core = "3.5.3"
camerax = "1.4.2"
# Shared RAW wire profile. Android uses tink-android; the isolated relay uses tink.
tink = "1.23.0"
# Relay build is isolated from the Android Kotlin plugin; see docs/sync/operations.md.
relay-kotlin = "2.3.21"
ktor = "3.6.0"
pgjdbc = "42.7.14"
hikari = "7.1.0"

