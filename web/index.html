<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#583D53" />
    <meta name="referrer" content="no-referrer" />
    <title>Usuals</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/list-colors.css" />
    <script type="module" src="/src/app.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
    <div class="app-shell">
      <aside class="rail">
        <a href="/" class="wordmark" aria-label="Usuals"
          ><img src="/assets/mark.svg" alt="" width="34" height="34" /><span
            >Usuals<span class="brand-dot">.</span></span
          ></a
        >
        <p class="eyebrow" data-i18n="tagline">A little more considered.</p>
        <nav
          id="navigation"
          aria-label="Navigation"
          data-i18n-label="navigation"
        >
          <button type="button" class="nav-button active" data-view="list">
            <span class="nav-icon">✓</span
            ><span data-i18n="lists">Lists</span>
          </button>
          <button type="button" class="nav-button" data-view="account">
            <span class="nav-icon">○</span
            ><span data-i18n="account">Account</span>
          </button>
        </nav>
        <div class="brand-collage rail-collage" aria-hidden="true">
          <span class="collage-secondary"></span><span class="collage-tertiary"></span>
          <span class="collage-paper"></span><span class="collage-primary"></span>
        </div>
        <div class="rail-bottom">
          <button id="preferences" class="nav-button preferences-button" type="button"
            aria-haspopup="dialog" data-i18n="quietPreferences">Preferences</button>
          <p class="server-note"><span class="status-dot" aria-hidden="true"></span>
            <span data-i18n="serverHeld">Kept on your server</span></p>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <div class="ambient-artwork" aria-hidden="true">
          <div class="brand-collage ambient-collage">
            <span class="collage-secondary"></span><span class="collage-tertiary"></span>
            <span class="collage-paper"></span><span class="collage-primary"></span>
          </div>
        </div>
        <header class="topbar">
          <span id="section-label" class="eyebrow"></span>
          <div class="top-actions">
            <button id="sync-status" class="sync-status" data-sync-status type="button" aria-haspopup="dialog" aria-label="Sync details" disabled><span class="sync-glyph" aria-hidden="true">↻</span></button>
          </div>
        </header>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="content"></div>
        <footer class="page-footer">
          <span>Usuals</span
          ><span data-i18n="footer">Good things, remembered.</span>
        </footer>
      </main>
    </div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
  </body>
</html>
