name: App behavioral evidence
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: net-app-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  device:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/behavioral-net'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: scripts/dgradle :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=4
      - name: Run the real device flows
        run: bash .github/scripts/net-app-device.sh
      - name: Upload device transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: net-app-device
          path: net-app-device/
  app-junit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/behavioral-net'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run scoped app controls and replays
        run: python3 .github/scripts/net-app-junit.py
      - name: Upload logs and JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: net-app-junit
          path: net-app-junit/
