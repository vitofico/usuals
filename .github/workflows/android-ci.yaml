name: android-ci

on:
  # Only main pushes here. Feature branches are validated through the
  # pull_request trigger below, and without the branch filter a push to a branch
  # that already has an open PR would fire this workflow twice, once per event.
  #
  # The version-bump commit this workflow pushes back to main does NOT re-trigger
  # it: GitHub suppresses workflow runs for pushes made with GITHUB_TOKEN. That
  # suppression is load-bearing in two places, here and in release-apk.yaml.
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a PR branch. Never cancel a run on main: every
# commit that lands there mints a version and is expected to produce a release.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Credential detection, over the whole git history rather than the working
  # tree, because a key that was committed and then deleted is still a key that
  # was published. See .gitleaks.toml for the rules and for the one rule about
  # the allowlist, which is that nothing in it is allowed to be a file path.
  #
  # CodeQL is not a substitute and the difference is worth stating once: it is
  # static analysis for code defects, it builds with tests excluded, and it
  # skips itself entirely while a repository is private. A pasted provider key
  # in a test file is invisible to all three of those.
  #
  # Roughly thirty seconds, which is why `build` waits for it rather than
  # running alongside. The build job pushes a version bump and a tag to main and
  # uploads an APK, and none of that should happen off a commit with a
  # credential in it. A false positive costs a wait and a one-line allowlist
  # entry; the alternative costs a rotation.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history. A shallow clone would scan the tip and call the
          # repository clean while the key sat three commits back.
          fetch-depth: 0

      # The image is pinned by digest, like every action here is pinned by SHA,
      # and it is the plain container rather than the official Action: that
      # Action asks an organisation for a licence key, and this needs none of
      # what the key buys.
      - name: Scan for credentials
        run: scripts/secret-scan

  build:
    needs: secrets-scan
    runs-on: ubuntu-latest
    # Outer net. The inner one is in build.gradle.kts, where every Test task
    # carries a ten-minute wall-clock timeout. Both exist because of quire, where
    # a wedged unit-test task was killed only by GitHub's six-hour maximum
    # execution limit: six runner-hours burned, and on one occasion a pushed tag
    # left stranded with no APK behind it. A cold run here is roughly twenty
    # minutes, most of it building the Android SDK image, so 45 is generous and
    # still fails long before GitHub's ceiling.
    timeout-minutes: 45
    permissions:
      contents: write # push the version-bump commit and the release tag
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # Runs before anything is compiled, so the APK this job uploads already
      # carries the version the tag will name. On a PR it only reads the value.
      - id: version
        name: Compute version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # CalVer from the calendar plus the CI run number, and deliberately
            # not from the tags that already exist. Galley derived its next
            # version from the tag list, so every failed retry minted a fresh
            # one: three tags, no artefacts. GITHUB_RUN_NUMBER is stable across
            # re-runs of the same run, so re-running a failure here retries the
            # same version instead of inventing another.
            BUILD_DATE=$(date -u +%Y-%m-%d)
            NEW_NAME="${BUILD_DATE//-/.}.${GITHUB_RUN_NUMBER}"

            # versionCode is a separate problem from versionName, and it used to
            # be solved by truncating the same run number: (yyMMdd * 100) + (run
            # number % 100). That is not monotonic. The run number counts every
            # run of this workflow, PR runs included, so all it takes is a
            # multiple of 100 falling between two merges on the same UTC day.
            # Run 99 produced 26091099 and run 100 produced 26091000, so the
            # code went backwards while the name kept climbing. Android compares
            # nothing but this integer: a build whose code is lower than the
            # installed one cannot be installed over it at all
            # (INSTALL_FAILED_VERSION_DOWNGRADE), and F-Droid both orders and
            # deduplicates builds by it.
            #
            # So the low two digits now count releases rather than CI runs: the
            # nth release cut on this UTC date, carried forward from the
            # VERSION_CODE the previous main run committed. Only a merge to main
            # moves it, the date field orders everything across days on its own,
            # and the number still reads as a date, 26091002 being the second
            # release of 2026-09-10. The name keeps the run number because a
            # re-run has to land on the version its first attempt named and the
            # run number is the only value that survives a re-run unchanged. The
            # two tails therefore do not match, which is one more reason the
            # changelog files F-Droid reads are named after the code and never
            # after the name.
            #
            # The boundaries this is built to survive:
            #
            #   The hundredth release of a single UTC day. The counter would
            #   spill into tomorrow's range, so the step fails with ::error:: and
            #   pushes nothing rather than minting a code that collides with the
            #   next day's first release. Widening the tail to three digits
            #   (yyMMdd * 1000) is the way out if that day ever comes, and still
            #   lands an order of magnitude below Android's 2100000000 ceiling.
            #
            #   A run number that resets. Renaming or recreating this workflow
            #   file restarts GITHUB_RUN_NUMBER at 1, which sends version names
            #   backwards. The code does not notice: it is a function of the date
            #   and of the last code committed, and neither of those resets.
            #
            #   A build in a new year. Rolling a day, a month or a year only ever
            #   increases the date field. The year is counted from 2000 rather
            #   than taken as two digits, so 2099-12-31 gives 99123199 and
            #   2100-01-01 gives 100010101, which is larger, and the scheme stays
            #   under the Android ceiling until roughly the year 4100.
            PREV_NAME=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
            PREV_CODE=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
            case "$PREV_CODE" in
              "" | *[!0-9]*)
                echo "::error::gradle.properties has no single numeric VERSION_CODE, refusing to guess the next one."
                exit 1
                ;;
            esac
            PREV_CODE=$((10#$PREV_CODE))

            YEAR=$(date -u +%Y)
            MM=$(date -u +%m)
            DD=$(date -u +%d)
            DAY=$(( (10#$YEAR - 2000) * 10000 + 10#$MM * 100 + 10#$DD ))

            if [ "$PREV_NAME" = "$NEW_NAME" ]; then
              # This tree already carries this run's bump, so it already carries
              # the code that went with it. Reuse it instead of counting twice.
              NEW_CODE=$PREV_CODE
            else
              if [ "$(( PREV_CODE / 100 ))" -eq "$DAY" ]; then
                NEW_CODE=$(( PREV_CODE + 1 ))
              else
                NEW_CODE=$(( DAY * 100 + 1 ))
              fi
              if [ "$(( NEW_CODE / 100 ))" -ne "$DAY" ]; then
                echo "::error::99 releases already went out on $BUILD_DATE (last code $PREV_CODE), and the same-day counter is two digits wide. Wait for UTC midnight or widen the tail."
                exit 1
              fi
              # Belt and braces. Every branch above is meant to climb, so if one
              # ever does not, the run stops here rather than on a user's phone.
              if [ "$NEW_CODE" -le "$PREV_CODE" ]; then
                echo "::error::versionCode $NEW_CODE would not beat the committed $PREV_CODE. Check the runner clock and gradle.properties before anything is pushed."
                exit 1
              fi
            fi

            sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$NEW_NAME/" gradle.properties
            sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$NEW_CODE/" gradle.properties

            # Commit locally only. Nothing reaches origin until the tests, the
            # APK and its upload have all gone green, so a run that fails or
            # hangs leaves origin exactly as it found it.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git diff --quiet -- gradle.properties; then
              # A re-run of a run whose bump already landed. There is nothing to
              # commit, and the point of re-running is to finish the same
              # version, so carry on with it rather than failing here.
              echo "gradle.properties already reads $NEW_NAME, re-running on top of an existing bump."
            else
              git add gradle.properties
              git commit -m ":bookmark: chore: release v$NEW_NAME"
            fi

            VERSION="$NEW_NAME"
          else
            VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      # The same image scripts/dgradle builds on a laptop, so CI and a
      # contributor's machine compile the same bytes. It is not restored from a
      # cache: the saved tar is well over a gigabyte and would crowd the Gradle
      # cache out of GitHub's 10 GB per-repository budget, which costs more on
      # every subsequent run than the image build costs on this one.
      #
      # Two tags, one build. scripts/dgradle looks the image up by the first
      # twelve hex characters of the Dockerfile's SHA-256, which is how a laptop
      # notices that the Dockerfile moved under it. Without that tag here, the
      # dgradle steps below would miss and build a second copy of the image this
      # step just built. sha256sum and dgradle's shasum -a 256 hash the same
      # bytes and take the same slice, so keep the two in step if either moves.
      - name: Build the build image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "usuals-build:$(sha256sum Dockerfile | cut -c1-12)" \
            -t usuals-build:latest .

      # scripts/dgradle keeps GRADLE_USER_HOME in a Docker named volume, and a
      # named volume dies with the runner. So the volume is round-tripped through
      # actions/cache: restored into it before the build, copied back out after.
      # Restoring on every run, saving only on main, keeps a PR from writing a
      # few hundred megabytes of cache each time it is pushed. A PR still reads
      # main's entry, because a branch run can read the default branch's caches.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/gradle-volume
          key: usuals-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}-${{ github.run_id }}
          restore-keys: |
            usuals-gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}-
            usuals-gradle-

      - name: Load the Gradle cache into the Docker volume
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gradle-volume"
          docker volume create usuals-gradle-cache >/dev/null
          if [ -n "$(ls -A "$RUNNER_TEMP/gradle-volume")" ]; then
            docker run --rm \
              -v usuals-gradle-cache:/vol \
              -v "$RUNNER_TEMP/gradle-volume":/backup:ro \
              alpine:3.20 sh -c 'cp -a /backup/. /vol/'
          else
            echo "No Gradle cache restored, this run pays for a cold dependency download."
          fi

      - name: Unit tests
        run: scripts/dgradle test

      - name: Assemble debug APK
        run: scripts/dgradle :app:assembleDebug

      - name: Verify native 16 KB alignment
        run: python3 scripts/check-native-alignment.py app/build/outputs/apk/debug/app-debug.apk

      # Exported even when the build failed: the dependencies it managed to
      # download are still worth keeping for the next run. Gradle writes into the
      # volume as root, so the copy is chowned back to the runner before
      # actions/cache tries to read it.
      - name: Export the Docker volume back to the cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gradle-volume"
          mkdir -p "$RUNNER_TEMP/gradle-volume"
          docker run --rm \
            -v usuals-gradle-cache:/vol \
            -v "$RUNNER_TEMP/gradle-volume":/backup \
            alpine:3.20 sh -c 'cp -a /vol/. /backup/ && rm -rf /backup/daemon /backup/native /backup/notifications'
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/gradle-volume"

      - name: Save the Gradle cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/gradle-volume
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # Deliberately before the tag exists. Galley created the tag first and
      # published second, so a registry failure left a tag pointing at a release
      # that was never built. Publish the artefact, then name it.
      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: usuals-debug-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Push version bump and tag
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::No version was computed, refusing to push a tag."
            exit 1
          fi

          # A re-run whose first attempt got as far as the push finds its own tag
          # already on origin. That is a finished job, not a conflict: leave it
          # alone and let the release job republish from it. Re-running must land
          # on the same version, never mint a second one.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "v$VERSION is already on origin, leaving it as it is."
            exit 0
          fi

          # quire's version-bump race: two Android PRs merging inside one CI
          # cycle produced two bot pushes, the second lost the race, and its tag
          # was silently orphaned. Rebasing means a lost race retries instead.
          # The residual is worth naming: the APK above was assembled from the
          # tree before the rebase, so if main moved during this run the tag
          # points at a tree that includes commits the uploaded APK does not. The
          # signed release APK is built from the tag itself, in release-apk.yaml,
          # so what users install always matches the tag.
          #
          # A conflict here means two version bumps raced, which the concurrency
          # group above should already prevent. It fails the step, pushes
          # nothing, and a re-run bumps cleanly from the new tip.
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"

          # The tag is created last, on the rebased commit, and pushed with
          # --atomic so the branch and the tag land together or not at all. Plain
          # git applies each refspec independently, which is how you end up with
          # a public tag pointing at a commit that never reached main.
          git tag "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF" "v$VERSION"

  # Builds and signs the release APK from the tag the build job just pushed, and
  # attaches it to a GitHub Release. Called rather than triggered: the tag push
  # above uses GITHUB_TOKEN, and GitHub does not start workflow runs for those,
  # so an `on: push: tags` trigger over there would never fire and would read
  # like an automatic release that silently is not one.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-apk.yaml
    with:
      tag: v${{ needs.build.outputs.version }}
    permissions:
      contents: write
    secrets: inherit
