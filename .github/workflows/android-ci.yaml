name: android-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: scripts/check-ci secrets
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore Gradle dependency artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/gradle-dependency-files
          key: android-modules-${{ runner.os }}-${{ hashFiles('Dockerfile', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
      - run: scripts/check-ci android
        env:
          USUALS_CI_DEPENDENCIES: ${{ runner.temp }}/gradle-dependency-files
      - name: Retain unit test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-unit-results
          path: '**/build/test-results/*/TEST-*.xml'
          if-no-files-found: error
          retention-days: 3
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore Gradle dependency artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/gradle-dependency-files
          key: server-modules-${{ runner.os }}-${{ hashFiles('Dockerfile', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
      - run: scripts/check-ci server
        env:
          USUALS_CI_DEPENDENCIES: ${{ runner.temp }}/gradle-dependency-files

  release:
    needs: [secrets-scan, android, server]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release-apk.yaml
    with:
      source: ${{ github.sha }}
    secrets: inherit
