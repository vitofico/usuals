name: Usuals library consolidation evidence
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'vitofico/usuals' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/consolidate-suites' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run consolidation controls and synthetic mutations
        run: python3 .github/usuals-lib-evidence/slim.py "$RUNNER_TEMP/usuals-lib-slim-evidence"
      - name: Retain fresh JUnit and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: usuals-lib-slim-evidence
          path: ${{ runner.temp }}/usuals-lib-slim-evidence
          if-no-files-found: error
          retention-days: 3
