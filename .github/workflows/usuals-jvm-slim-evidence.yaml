name: Usuals JVM slim evidence
on:
  pull_request:
    paths:
      - '.github/evidence/usuals-jvm-slim.py'
      - '.github/workflows/usuals-jvm-slim-evidence.yaml'
      - 'core/**'
      - 'enrich/**'
      - 'llm/**'
      - 'recipe/**'
      - 'smart/**'
      - 'sync/**'
permissions:
  contents: read
jobs:
  slim-jvm:
    if: github.head_ref == 'test/consolidate-suites' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 .github/evidence/usuals-jvm-slim.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: usuals-jvm-slim
          path: usuals-jvm-evidence/
          if-no-files-found: error
          retention-days: 7
