name: App consolidation evidence
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: slim-app-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  app-junit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/consolidate-suites'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run scoped app controls and replays
        run: python3 .github/scripts/slim-app-junit.py
      - name: Upload logs and JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slim-app-junit
          path: slim-app-junit/
