name: Usuals JVM evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/evidence/usuals-jvm-net.py'
      - '.github/workflows/usuals-jvm-evidence.yaml'
      - 'core/**'
      - 'enrich/**'
      - 'llm/**'
      - 'recipe/**'
      - 'smart/**'
      - 'sync/**'
      - 'testing/src/test/resources/shared-list-v1/**'
permissions:
  contents: read
jobs:
  net-jvm:
    if: github.head_ref == 'test/behavioral-net' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 .github/evidence/usuals-jvm-net.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: usuals-jvm-net
          path: usuals-jvm-evidence/
          if-no-files-found: error
          retention-days: 7
