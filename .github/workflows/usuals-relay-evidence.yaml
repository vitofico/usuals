name: Relay regression evidence
on: pull_request
permissions:
  contents: read
jobs:
  relay:
    if: github.event.pull_request.head.ref == 'test/behavioral-net' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 .github/evidence/usuals-relay-net.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relay-evidence
          path: ${{ runner.temp }}/relay-evidence
