apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usuals-ai-egress
  namespace: usuals
spec:
  podSelector:
    matchLabels:
      app: usuals-relay
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
          podSelector:
            matchLabels:
              app: ollama
      ports: [{protocol: TCP, port: 11434}]
