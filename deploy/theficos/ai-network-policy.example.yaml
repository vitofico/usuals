# Optional proposal. Apply both directions only with an approved AI rollout.
# These resources are deliberately absent from kustomization.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usuals-ai-egress
  namespace: usuals
spec:
  podSelector:
    matchLabels:
      app: usuals-relay
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ollama
          podSelector:
            matchLabels:
              app: ollama
      ports: [{protocol: TCP, port: 11434}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-usuals
  namespace: ollama
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: usuals
          podSelector:
            matchLabels:
              app: usuals-relay
      ports: [{protocol: TCP, port: 11434}]
