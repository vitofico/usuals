apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: usuals-postgres}
spec:
  storageClassName: ''
  volumeName: usuals-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: usuals-identity}
spec:
  storageClassName: ''
  volumeName: usuals-identity
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: usuals-backups}
spec:
  nfs: null
  local: {path: /mnt/cluster-data/usuals/backups}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [theficos]}
