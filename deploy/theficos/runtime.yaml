apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuals-relay
  annotations:
    usuals.io/source-commit: 9c3bd572890f87911512232c55890171e9cb4eae
spec:
  template:
    spec:
      # Keep OIDC on the verified LAN ingress while retaining HTTPS hostname checks.
      hostAliases:
        - ip: 192.168.1.210
          hostnames: [auth.theficos.dedyn.io]
      containers:
        - name: relay
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
          env:
            - {name: USUALS_TRUSTED_PROXY_CIDRS, value: '10.1.41.64/26,10.1.41.128/26'}
            - {name: USUALS_LOCAL_AUTH_ENABLED, value: 'true'}
            - {name: USUALS_OIDC_ENABLED, value: 'true'}
            - {name: USUALS_OIDC_ISSUER, value: 'https://auth.theficos.dedyn.io/application/o/usuals/'}
            - {name: USUALS_OIDC_CLIENT_ID, value: usuals-web}
            - {name: USUALS_OIDC_CLIENT_SECRET_FILE, value: /run/oidc/client-secret}
            - {name: USUALS_OIDC_ADMIN_SUBJECTS, value: '[]'}
            - {name: USUALS_OIDC_ALLOWED_GROUPS, value: '["homelab-users","homelab-admins"]'}
          volumeMounts:
            - {name: oidc-secret, mountPath: /run/oidc/client-secret, subPath: client-secret, readOnly: true}
      volumes:
        - name: oidc-secret
          secret: {secretName: usuals-oidc, defaultMode: 0440}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: usuals-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          imagePullPolicy: Never
          resources:
            requests: {cpu: 150m}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: usuals-base-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: base-backup
              imagePullPolicy: Never
              resources:
                requests: {cpu: 50m}
