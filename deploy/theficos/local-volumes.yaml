apiVersion: v1
kind: PersistentVolume
metadata: {name: usuals-postgres}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef: {namespace: usuals, name: usuals-postgres}
  local: {path: /mnt/cluster-data/usuals/postgres}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [theficos]}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: usuals-identity}
spec:
  capacity: {storage: 100Mi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef: {namespace: usuals, name: usuals-identity}
  local: {path: /mnt/cluster-data/usuals/identity}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [theficos]}
