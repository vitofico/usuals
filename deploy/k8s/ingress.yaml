apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comanda
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [comanda.theficos.dedyn.io]
      secretName: comanda-tls
  rules:
    - host: comanda.theficos.dedyn.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comanda-relay
                port: {name: http}
