apiVersion: v1
kind: Service
metadata:
  name: usuals-relay
spec:
  selector:
    app: usuals-relay
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuals-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: usuals-relay
  template:
    metadata:
      labels:
        app: usuals-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay
          # Replace with the locally tested immutable image digest before import/deployment.
          image: usuals-relay:deployment-not-approved
          imagePullPolicy: Never
          env:
            - {name: USUALS_IDENTITY_FILE, value: /identity/identity}
            - {name: USUALS_FENCE_FILE, value: /identity/fence}
            - {name: USUALS_JDBC_URL, value: 'jdbc:postgresql://usuals-postgres:5432/usuals'}
            - {name: USUALS_DB_USER, value: usuals}
            - {name: USUALS_DB_PASSWORD_FILE, value: /run/secrets/app-password}
            - {name: USUALS_ORIGIN, value: 'https://usuals.theficos.dedyn.io'}
            - {name: USUALS_OPS_BIND, value: '0.0.0.0'}
            - {name: USUALS_TRUSTED_PROXY_CIDRS, value: REPLACE_WITH_VERIFIED_INGRESS_PEER_CIDR}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: identity, mountPath: /identity, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - {name: identity, persistentVolumeClaim: {claimName: usuals-identity, readOnly: true}}
        - name: secrets
          secret: {secretName: usuals-postgres, defaultMode: 0440, items: [{key: app-password, path: app-password}]}
        - {name: temporary, emptyDir: {sizeLimit: 32Mi}}
