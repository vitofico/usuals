apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: comanda
resources:
  - namespace.yaml
  - storage.yaml
  - postgres.yaml
  - relay.yaml
  - ingress.yaml
  - network-policy.yaml
  - backup.yaml
configMapGenerator:
  - name: comanda-postgres-tools
    files:
      - archive-wal=tools/archive-wal
      - base-backup=tools/base-backup
      - initialize.sql
      - initialize-replication.sh
# Secret files and explicit one-shot identity/migration jobs are operator steps.
